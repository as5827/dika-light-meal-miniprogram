name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 服务端语法检查
        run: |
          for f in server/*.js scripts/*.js; do node --check "$f"; done

      - name: 小程序类型检查
        working-directory: miniprogram
        run: |
          npm ci
          npx tsc --noEmit

      - name: 端到端自测（73 项）
        env:
          PORT: '3000'
          LOG_TO_FILE: '1'
          LOG_FILE: ${{ github.workspace }}/logs/app.log
        run: |
          mkdir -p logs
          node server/server.js &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/api/menu > /dev/null 2>&1 && break
            sleep 0.5
          done
          node scripts/selftest.js
          echo "--- 日志尾部 ---"
          tail -n 5 logs/app.log
